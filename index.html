<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venus’s Bizarre Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#07040b;--panel:#0f0814;--line:#4a1a33;--ink:#eadff5;--dim:#9a7f9e;--vio:#8b3fd9;--blood:#be123c;--gold:#e4dcf2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#2e0f26 0%,var(--bg) 55%) fixed,var(--bg);color:var(--ink);font-family:"VT323",ui-monospace,Menlo,monospace;font-size:21px;line-height:1.35;min-height:100vh}
h1,h2{font-family:"Cinzel",Georgia,serif;letter-spacing:.06em;margin:0}
main{max-width:720px;margin:0 auto;padding:28px 18px 80px;position:relative;z-index:1}
header{text-align:center;padding:10px 0 4px}
h1{font-size:clamp(26px,6vw,40px);color:var(--ink);text-shadow:0 0 22px var(--vio)}
.sub{color:var(--dim);margin-top:6px}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0b0710ee;border:1px solid var(--line);padding:8px 12px;margin:18px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar{flex:1;height:12px;border:1px solid var(--line);background:#000}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vio),var(--blood));transition:width .3s}
#sigilWrap{position:relative;width:min(84vw,330px);aspect-ratio:1;margin:20px auto 6px;display:grid;place-items:center}
#sigil{width:68%;position:relative;cursor:pointer;filter:drop-shadow(0 0 16px var(--vio));transition:transform .08s;-webkit-tap-highlight-color:transparent;user-select:none}
#sigil:active{transform:scale(.93) rotate(-4deg)}
.hint{text-align:center;color:var(--dim);min-height:28px}
section{border:1px solid var(--line);background:var(--panel);padding:34px 18px 18px;margin:22px 0;border-radius:90px 90px 6px 6px/64px 64px 6px 6px;box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px var(--line);animation:rise .6s both}
section.locked{opacity:.55;border-style:dashed;text-align:center;color:var(--dim)}
section h2{font-size:20px;color:var(--gold);margin-bottom:10px;text-align:center}section h2::after{content:"— ❧ —";display:block;color:var(--blood);font-size:16px;margin-top:2px}
.stat{display:grid;grid-template-columns:150px 1fr 28px;gap:8px;align-items:center;margin:4px 0}
.stat .t{height:10px;background:#000;border:1px solid var(--line)}.stat .t i{display:block;height:100%;background:var(--vio)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--line);background:#0f0818;padding:10px;cursor:pointer}
.card b{color:var(--vio)}.card small{display:block;color:var(--dim)}
.card.off{filter:grayscale(1) brightness(.6)}
.meme{border-left:3px solid var(--blood);padding:6px 10px;margin:8px 0;cursor:pointer;background:#0f0818}
.meme span{color:var(--dim)}
.letter{font-family:"Cinzel",Georgia,serif;font-size:18px;line-height:1.7}
.big{font-size:26px;color:var(--gold);text-align:center;margin-top:14px}
.float{position:fixed;pointer-events:none;font-size:24px;color:var(--gold);animation:fl 1s forwards;z-index:20}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,420px);background:#000;border:2px solid var(--gold);padding:12px;z-index:30;text-align:center}
button{font:inherit;color:var(--ink);background:var(--vio);border:0;padding:4px 14px;cursor:pointer;margin:6px 4px 0}
button.b2{background:#333}
.shake{animation:sh .5s 3}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fl{to{opacity:0;transform:translateY(-70px)}}
@keyframes sh{25%{transform:translate(4px,-3px)}75%{transform:translate(-4px,3px)}}
.reset{display:block;margin:40px auto 0;background:none;color:var(--dim);font-size:16px}
#wreath{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;animation:spin 90s linear infinite}
#fog{position:fixed;left:-20%;right:-20%;bottom:0;height:40vh;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 20% 100%,#ffffff14,transparent 60%),radial-gradient(ellipse at 70% 100%,#8b3fd91c,transparent 60%);animation:drift 22s ease-in-out infinite alternate}
.petal{position:fixed;pointer-events:none;width:12px;height:16px;border-radius:0 100% 0 100%;z-index:20;animation:pt 1.4s ease-out forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translateX(12%)}}
@keyframes pt{to{opacity:0;transform:translate(var(--dx),90px) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){#wreath,#fog{animation:none}}
#bdb{position:fixed;inset:0;z-index:40;background:#07040bf5;display:grid;place-items:center;text-align:center;padding:24px}
#bdb h1{font-size:clamp(28px,8vw,48px);text-shadow:0 0 24px var(--blood);margin:10px 0}
#bdb p{color:var(--dim)}
.door{display:inline-block;background:var(--blood);color:#fff;padding:6px 26px;text-decoration:none;font-size:28px;box-shadow:0 0 22px var(--blood)}
#app{position:relative}
.find{position:absolute;z-index:3;background:none;border:0;padding:6px;font-size:20px;line-height:1;opacity:.28;cursor:pointer;transform:translateX(-50%)}
.find:hover{opacity:1}
.pl{font:inherit;color:#fff;background:var(--vio);border:0;padding:6px 16px;cursor:pointer;margin:6px 4px 0}
#mgrid{display:grid;gap:8px;margin:10px 0}
.mc{width:100%;min-width:0;box-sizing:border-box;overflow:hidden;aspect-ratio:3/4;font:inherit;font-size:clamp(18px,6vw,26px);line-height:1;background:var(--panel);border:2px solid var(--line);color:#e8c26a;padding:0;cursor:pointer}
.mc.up{border-color:#e8c26a}.mc.ok{border-color:var(--vio);opacity:.75}
/* ===== Christmas theme (turns on Dec 25-31, or with #christmas on the URL) ===== */
body.xmas{--bg:#050e09;--panel:#0a150e;--line:#5c1a27;--vio:#2f9e63;--blood:#c8102e;--gold:#f0d78c;--ink:#f2efe6;--dim:#8fa597;background:radial-gradient(ellipse at 50% -10%,#14301f 0%,var(--bg) 55%) fixed,var(--bg)}
body.xmas #sigil{overflow:visible}
body.xmas #sigil circle[stroke="#a855f7"]{stroke:#2f9e63}
body.xmas #fog{background:radial-gradient(ellipse at 20% 100%,#ffffff1c,transparent 60%),radial-gradient(ellipse at 70% 100%,#2f9e631c,transparent 60%)}
.snow{position:fixed;top:-24px;color:#fff;opacity:.75;pointer-events:none;z-index:2;user-select:none;animation:snow linear infinite}
@keyframes snow{to{transform:translate(var(--sx),calc(100vh + 48px))}}
</style>
</head>
<body>
<div id="fog"></div>
<main id="app">
<header>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
</header>
<div class="hud"><span id="lv"></span><svg id="lily" viewBox="0 0 60 64" width="56" height="60" aria-hidden="true"></svg><span id="xp"></span></div>
<div id="sigilWrap"><svg id="wreath" viewBox="-130 -130 260 260" aria-hidden="true"></svg>
<svg id="sigil" viewBox="0 0 200 200" role="button" aria-label="Poke the sigil">
  <circle cx="100" cy="100" r="92" fill="#0b0710" stroke="#a855f7" stroke-width="5"/>
  <path d="M8 100h184" stroke="#e11d48" stroke-width="5"/>
  <polygon points="100,26 118,82 176,82 128,116 146,172 100,138 54,172 72,116 24,82 82,82" fill="none" stroke="#e8c26a" stroke-width="3" transform="rotate(180 100 100)"/>
  <circle cx="100" cy="100" r="22" fill="#0b0710" stroke="#a855f7" stroke-width="5"/>
  <circle id="eye" cx="100" cy="100" r="8" fill="#e11d48"/>
</svg>
</div>
<div class="hint" id="hint"></div>
<div class="hint" id="fcount" hidden></div>
<div id="rooms"></div>
<div class="big" id="tbc" hidden>To Be Continued ⟶</div>
<button class="reset" id="reset">reset progress</button>
</main>
<script>
/* ===== EDIT THIS PART — everything personal lives here ===== */
const CONFIG = {
  name: "Venus",
  from: "Hiram/Hentai",
  title: "Venus’s Bizarre Adventure",
  sub: "something here is asleep. poke it.",
  bday:{month:2,day:2,
    banner:"Today the whole site is yours.",
    message:"Today is your day and I am at your command, choose any item from your carts and it is yours.",
    prizes:["A surprise gift from Hiram"]},
  wa:"12424321512",   // your WhatsApp: coupons and prizes message you here
  titles:["Stranger","Acquaintance","Friend","Good Friend","Close Friend","Best Friend","Partner in Crime","Bonded for Life"],   // one per bond level (0-7)
  daily:{start:"2026-11-27"},   // daily bonus starts this day; each new day begins at 6am
  coupons:[   // The Coupon Room (250 XP) - placeholders, change these
    {name:"Dinner and drinks on me",text:"Dinner and drinks, my treat."},
    {name:"Movie night",text:"You pick the movie."}],
  prize:{title:"Custom drawing of you and your Pokémon team",text:"You reached 500 XP. A custom drawing by a local artist.",unlock:"2027-02-02"},   // 500 XP prize, locked until her birthday
  finale:{title:"Bonded for Life",unlock:"2027-01-01",   // 1000 XP, locked until Jan 1
    paragraphs:["(Your long final letter goes here.)"],
    prize:{title:"A hand-painted Zereaux piece, designed with you",text:"You reached 1000 XP. You pick the piece, the theme and the colors, and I paint it just for you."}},
  xmas:{on:true,gifts:true,from:25,to:31,   // on:true = Christmas theme Dec 25-31; gifts:true shows the "Under the Tree" card (needs gifts.html in the repo)
    banner:"I wrapped up a little world just for you. Poke it.",
    sub:"a gift, wrapped in snow. poke it."},
  encounterMon: "Venus",           // "A wild ___ appeared!"
  stand: {
    name: "「Venus in Furs」",
    user: "Venus",
    stats: [["Destructive Power","A"],["Speed","A"],["Range","B"],["Durability","C"],["Precision","D"],["Potential","A"]],
    abilities: [
      {at:5,  name:"Total Blackout", song:"Black No. 1", text:"Everything Venus in Furs touches turns pitch black: outfits, moods, hair dye, entire rooms. Part two, Black Vearth, leaves anyone caught in the darkness with slight insanity and creeping anxiety: rattled, paranoid, and jumping at shadows. It does all of this with maximum drama and a wink."},
      {at:20, name:"Spellbound", song:"Spellbound", text:"One look and the target’s will goes soft. A hypnotic gaze that makes opponents agree to almost anything."},
      {at:35, name:"A Forest", song:"A Forest", text:"A thick fog rolls in and every exit quietly disappears. Enemies wander in circles while Venus in Furs strolls through like she owns the place, and from the mist, strikes land at random. Nobody ever sees where the next one is coming from."},
      {at:45, name:"Tear You Apart", song:"Tear You Apart", text:"Close-range assault. Venus in Furs closes the gap in a blink, and the barrage leaves nothing but glitter and regret."}
    ]
  },
  dex: [
    ["#001","The Giggle","Her signature sound. She laughs easily and often, and it spreads to everyone nearby."],
    ["#002","Auntie","Known to everyone as Aunty. The title says it all."],
    ["#003","The Artist","Creates original characters from scratch. Love to the point of invention."],
    ["#004","The Cosplayer","Brings characters to life, her own creations included."],
    ["#005","Black Vearth","The second part of Total Blackout. It leaves enemies paranoid and rattled, jumping at shadows."],
    ["#006","Cursed Snack","Vergil."]
  ],
  memes: [
    ["Menacing (ゴゴゴ)","Venus enters the room. The aura arrives first. Then the giggle, and the menace is gone."],
    ["Gotta catch ’em all","Pokémon trainers collect creatures. Auntie collects friends, and none of us were ever getting away."],
    ["Suspiciously vampire","Dressed for the night, and gone in an instant. Nobody has ever seen her leave. Vampires are taking notes."],
    ["Auntie, certified","She created the name and adopted the responsibility. Auntie isn’t a nickname, it’s a job, and she took it."],
    ["Original character, original problems","Every OC she makes is cooler than the canon. This is just science."]
  ],
  letter: [
    "Venus, you are flawed, and you love yourself anyway. You’re a ball of stress and fun, Miss Giggles herself, the one everyone wants to be around.",
    "Every time you smile, giggle, or laugh, it makes me happy that you exist.",
    "But you’re also soft, in a way I can’t really describe.",
    "Your art comes from your soul. You can tell you put yourself into it every single time.",
    "You’re the one I would like to love and bet everything on. I want to see you grow and become everything you dream of, and I’ll support you through all of it."
  ]
};
/* Each room unlocks at a number of pokes. Add more later! */
const ROOMS = [
  {at:5,  id:"stand",  name:"Stand Card"},
  {at:15, id:"dex",    name:"The Friend-dex"},
  {at:30, id:"memes",  name:"Meme Vault"},
  {at:50, id:"letter", name:"A Letter"},
  {at:250, id:"coupons", name:"The Coupon Room"},
  {at:500, id:"prize", name:"500 XP Prize"},
  {at:1000, id:"finale", name:"Bonded for Life"}
];
/* ============================================================ */
const $=id=>document.getElementById(id);
const KEY="bond-v1";
let S={xp:0,seen:{},ora:false};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.title=CONFIG.title;$("title").textContent=CONFIG.title;$("sub").textContent=CONFIG.sub;

const builders={
  bday:()=>{return `<h2>A gift is waiting</h2><p style='text-align:center'><a class='door' href='birthday.html${PREVIEW?'#birthday':''}'>Open the door</a></p>`;},
  bdayOld:()=>{const p=S.seen['bp'+BK];return `<h2>Happy Birthday, ${esc(CONFIG.name)}</h2><p style='text-align:center'>${esc(CONFIG.bday.message)}</p>`+(p?`<div class='meme' style='cursor:default'><b>You caught a wild ${esc(CONFIG.encounterMon)}!</b><br>Your prize: ${esc(p)}</div>`:`<p style='text-align:center;color:var(--dim)'>A wild ${esc(CONFIG.encounterMon)} might show up today. It’s a hard one to catch…</p>`);},
  stand:()=>`<h2>${esc(CONFIG.stand.name)}</h2><div>Stand User: ${esc(CONFIG.stand.user)}</div><br>`+
    CONFIG.stand.stats.map(([n,g])=>{const w={A:100,B:80,C:60,D:40,E:20}[g]||50;return `<div class="stat"><span>${esc(n)}</span><div class="t"><i style="width:${w}%"></i></div><b>${esc(g)}</b></div>`}).join("")+
    `<h2 style="margin-top:14px">Abilities</h2>`+CONFIG.stand.abilities.map(a=>S.xp>=a.at?`<div class="meme"><b>${esc(a.name)}</b> <span>♪ ${esc(a.song)}</span><br>${esc(a.text)}</div>`:`<div class="meme" style="opacity:.5">🔒 ??? — ${a.at-S.xp} more XP</div>`).join(""),
  dex:()=>`<h2>The Friend-dex</h2><div class="dex">`+CONFIG.dex.map((d,i)=>`<div class="card off" data-i="${i}"><b>${esc(d[0])}</b> ???<small>tap to register</small></div>`).join("")+`</div>`,
  memes:()=>`<h2>Meme Vault</h2>`+CONFIG.memes.map((m,i)=>`<div class="meme" data-m="${i}"><b>${esc(m[0])}</b><br><span class="tr">tap to reveal</span><div hidden>${esc(m[1])}</div></div>`).join(""),
  letter:()=>`<h2>For ${esc(CONFIG.name)}</h2><div class="letter">`+CONFIG.letter.map(p=>`<p>${esc(p)}</p>`).join("")+`<p>— ${esc(CONFIG.from)}</p></div>`,
  coupons:()=>`<h2>The Coupon Room</h2>`+CONFIG.coupons.map((c,i)=>(c.unlock&&!PREVIEW&&fmtD(new Date())<c.unlock)?`<div class="meme" style="opacity:.5;cursor:default">🔒 ??? — opens on your birthday</div>`:`<div class="meme" style="cursor:default"><b>${esc(c.name)}</b><br>${esc(c.text)}<br><button class="pl" data-wa="${esc("Coupon redeemed: "+c.name+" - "+c.text)}" data-k="cp${i}">${S.seen["cp"+i]?"Requested ✓ (send again)":"Redeem"}</button></div>`).join(""),
  prize:()=>(CONFIG.prize.unlock&&!PREVIEW&&fmtD(new Date())<CONFIG.prize.unlock)?`<h2>500 XP Prize</h2><div class="meme" style="opacity:.5;cursor:default">🔒 ??? — opens on your birthday</div>`:`<h2>500 XP Prize</h2><div class="meme" style="cursor:default"><b>${esc(CONFIG.prize.title)}</b><br>${esc(CONFIG.prize.text)}<br><button class="pl" data-wa="${esc("I reached 500 XP! Claiming: "+CONFIG.prize.title)}" data-k="pz">${S.seen.pz?"Claimed ✓":"Claim it"}</button></div>`,
  finale:()=>(CONFIG.finale.unlock&&!PREVIEW&&fmtD(new Date())<CONFIG.finale.unlock)?`<h2>Final room</h2><div class="meme" style="opacity:.5;cursor:default">🔒 ??? — opens on January 1st</div>`:`<h2>${esc(CONFIG.finale.title)}</h2><div class="letter">`+CONFIG.finale.paragraphs.map(p=>`<p>${esc(p)}</p>`).join("")+`</div><div class="meme" style="cursor:default"><b>${esc(CONFIG.finale.prize.title)}</b><br>${esc(CONFIG.finale.prize.text)}<br><button class="pl" data-wa="${esc("I reached 1000 XP! Claiming: "+CONFIG.finale.prize.title)}" data-k="fz">${S.seen.fz?"Claimed ✓":"Claim it"}</button></div>`,
  arcade:()=>`<h2>Memory Arcade</h2><p style="text-align:center" id="mgi"></p><div id="mgrid"></div><p style="text-align:center"><button class="pl" id="mnext" hidden>Next level</button></p>`
};

function floater(x,y,t){const f=document.createElement("div");f.className="float";f.textContent=t;f.style.left=x+"px";f.style.top=y+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1000);}

function render(){
  const next=ROOMS.find(r=>S.xp<r.at);
  const lvl=ROOMS.filter(r=>S.xp>=r.at).length;
  $("lv").innerHTML="BOND LV "+lvl+"<br><small>"+esc((CONFIG.titles||[])[(lvl===7&&CONFIG.finale.unlock&&!PREVIEW&&fmtD(new Date())<CONFIG.finale.unlock)?6:lvl]||"")+"</small>";
  $("xp").textContent=S.xp+" XP";
  const prev=lvl?ROOMS[lvl-1].at:0;
  lily(Math.min(1,S.xp/ROOMS[ROOMS.length-1].at));
  $("hint").textContent=next?(S.xp===0?"poke the sigil":(next.at-S.xp)+" more until something wakes up…"):"everything is awake. for now.";
  const host=$("rooms");host.innerHTML="";
  if(IS_XMAS&&CONFIG.xmas.gifts){const xs=document.createElement('section');xs.id='xmas';xs.innerHTML='<h2>Under the Tree</h2><p style="text-align:center">Something is waiting under the tree.</p><p style="text-align:center"><a class="door" href="gifts.html">Go look</a></p>';host.appendChild(xs);}
  if(CONFIG.daily&&dk()>=CONFIG.daily.start){const d=dayInfo(),ds=document.createElement("section");ds.id="daily";ds.innerHTML=d.claimed?`<h2>Daily bonus</h2><p style="text-align:center">Claimed ✓ Come back after 6am for +${Math.min(20+5*d.streak,50)} XP</p>`:`<h2>Daily bonus</h2><p style="text-align:center">Day ${d.streak} · +${d.xp} XP</p><p style="text-align:center"><button class="pl" data-claim>Claim</button></p>`;host.appendChild(ds);}
  ROOMS.forEach(r=>{
    const s=document.createElement("section");
    if(S.xp>=r.at){s.innerHTML=builders[r.id]();s.id=r.id;}
    else{s.className="locked";s.textContent="🔒 ??? — "+(r.at-S.xp)+" more XP";}
    host.appendChild(s);
  });
  if(S.xp>=30){const gs=document.createElement('section');gs.id='arcade';gs.innerHTML=builders.arcade();host.appendChild(gs);}
  const bs=document.createElement('section');if(IS_BDAY){bs.id='bday';bs.innerHTML=builders.bday();}else{bs.className='locked';bs.textContent='🔒 Something wakes on February 2nd…';}host.appendChild(bs);
  $("tbc").hidden=S.xp<ROOMS[ROOMS.length-1].at;
  drawGame();updFinds();
  // interactions
  host.querySelectorAll(".card").forEach(c=>{
    const i=c.dataset.i;
    const show=()=>{const d=CONFIG.dex[i];c.classList.remove("off");c.innerHTML=`<b>${esc(d[0])}</b> ${esc(d[1])}<small>${esc(d[2])}</small>`;};
    if(S.seen["d"+i])show();
    c.onclick=()=>{if(!S.seen["d"+i]){S.seen["d"+i]=1;add(2,c);show();}};
  });
  host.querySelectorAll(".meme[data-m]").forEach(m=>{const i=m.dataset.m,t=m.querySelector(".tr");
    const d=m.querySelector("div");
    const open=()=>{d.hidden=false;if(t)t.remove();};if(S.seen["mm"+i])open();
    m.onclick=()=>{open();if(!S.seen["mm"+i]){S.seen["mm"+i]=1;add(2,m);}};
  });
}

function add(n,el,ev){
  const before=ROOMS.filter(r=>S.xp>=r.at).length;
  S.xp+=n;save();
  const after=ROOMS.filter(r=>S.xp>=r.at).length;
  const b=el&&el.getBoundingClientRect?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0};
  const px=ev?ev.clientX:b.left+b.width/2,py=ev?ev.clientY:b.top;floater(px,py,"+"+n);petals(px,py,Math.min(n,4));
  render();
  if(after>before){const room=ROOMS[after-1];setTimeout(()=>{const e=$(room.id);if(e)e.scrollIntoView({behavior:"smooth",block:"center"});},150);}
}

/* ===== daily bonus, hidden finds, memory arcade ===== */
const fmtD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dk=()=>fmtD(new Date(Date.now()-6*36e5));   // a new "day" starts at 6am
const dBefore=k=>{const d=new Date(k+"T12:00:00");d.setDate(d.getDate()-1);return fmtD(d);};
function dayInfo(){const k=dk(),dl=S.dl||{},claimed=dl.last===k,streak=claimed?(dl.streak||1):(dl.last===dBefore(k)?(dl.streak||0)+1:1);return{k,claimed,streak,xp:Math.min(20+5*(streak-1),50)};}
function claimDaily(){const d=dayInfo();if(d.claimed)return;S.dl={last:d.k,streak:d.streak};add(d.xp);}

const FINDS=[["🦇",8,6],["🕯️",91,14],["🌙",5,27],["💀",93,38],["🥀",12,49],["⚡",88,58],["👻",6,70],["🔮",90,79],["🌹",14,88],["🕷️",84,95]];
function updFinds(){const n=FINDS.filter((f,i)=>S.seen["f"+i]).length,e=$("fcount");e.hidden=!n;e.textContent="hidden finds: "+n+"/"+FINDS.length;}
function mkFind(f,key,xp){const b=document.createElement("button");b.className="find";b.textContent=f[0];b.setAttribute("aria-label","something hidden");b.style.left=f[1]+"%";b.style.top=f[2]+"%";b.onclick=e=>{S.seen[key]=1;b.remove();add(xp,null,e);};$("app").appendChild(b);}
FINDS.forEach((f,i)=>{if(!S.seen["f"+i])mkFind(f,"f"+i,5);});
if(!S.seen.fr)mkFind(["✦",50,99],"fr",25);   // the rare one

const MG=["ゴ","👻","🦇","🌙","🌹","🕯️","💀","🔮","⚡","🎴"];
let G={L:S.mg||0,deck:[],st:[],open:[],lock:false,moves:0,found:0,won:false};
function dealG(){const f=MG.slice(0,Math.min(3+G.L,MG.length));G.deck=f.concat(f).map(v=>({v}));
  for(let i=G.deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[G.deck[i],G.deck[j]]=[G.deck[j],G.deck[i]];}
  G.st=G.deck.map(()=>0);G.open=[];G.lock=false;G.moves=0;G.found=0;G.won=false;}
function drawGame(){const g=$("mgrid");if(!g)return;if(!G.deck.length)dealG();
  g.style.gridTemplateColumns="repeat("+(G.deck.length>12?5:4)+",minmax(0,1fr))";
  g.innerHTML=G.deck.map((c,k)=>`<button class="mc ${G.st[k]===1?"up":G.st[k]===2?"ok":""}" data-k="${k}">${G.st[k]?c.v:"?"}</button>`).join("");
  $("mgi").textContent=G.won?"Level "+(G.L+1)+" cleared!":"Level "+(G.L+1)+" · "+G.deck.length/2+" pairs · moves "+G.moves;
  $("mnext").hidden=!G.won;}
function flipG(k){if(G.lock||G.st[k]||G.won)return;G.st[k]=1;G.open.push(k);drawGame();if(G.open.length<2)return;
  G.moves++;G.lock=true;const a=G.open[0],b=G.open[1];
  if(G.deck[a].v===G.deck[b].v){G.st[a]=G.st[b]=2;G.found++;G.open=[];G.lock=false;
    if(G.found===G.deck.length/2){G.won=true;S.mg=G.L+1;save();if(G.L<8)add(Math.min(5+G.L,12));else drawGame();}else drawGame();}
  else setTimeout(()=>{G.st[a]=G.st[b]=0;G.open=[];G.lock=false;drawGame();},Math.max(350,800-70*G.L));}

$("rooms").addEventListener("click",e=>{const t=e.target;
  if(t.closest("[data-claim]")){claimDaily();return;}
  const w=t.closest("[data-wa]");if(w){S.seen[w.dataset.k]=1;save();window.open("https://wa.me/"+CONFIG.wa+"?text="+encodeURIComponent(w.dataset.wa),"_blank");render();return;}
  const m=t.closest(".mc");if(m){flipG(+m.dataset.k);return;}
  if(t.closest("#mnext")){G.L=S.mg||0;dealG();drawGame();}
});

const PET='M0 0C-7-8-6-22 0-30C6-22 7-8 0 0Z';
function lily(p){const a=[-78,-46,-16,16,46,78];let s=`<path d='M30 40Q28 52 30 62' stroke='#2f6b46' stroke-width='2' fill='none'/><path d='M30 54Q18 50 14 42Q24 44 30 54Z' fill='#2f6b46'/><path d='M30 52Q42 48 46 40Q36 42 30 52Z' fill='#2f6b46'/><g transform='translate(30 40)'>`;
a.forEach((d,i)=>{const r=d*p+(i%2?4:-4)*(1-p);s+=`<path d='${PET}' transform='rotate(${r.toFixed(1)}) scale(${(0.55+0.45*p).toFixed(2)})' fill='${i%2?'#f3e9ff':'#d9c8f0'}' stroke='#8b3fd9' stroke-width='1'/>`;});
s+=`<g opacity='${p}'>`+[-5,0,5].map(x=>`<circle cx='${x}' cy='-14' r='1.6' fill='#be123c'/>`).join('')+`</g></g>`;
$('lily').innerHTML=s;}
function buildWreath(){let s=`<circle r='108' fill='none' stroke='#5b1a36' stroke-width='1.5'/><circle r='108' fill='none' stroke='#2f6b46' stroke-width='1' stroke-dasharray='3 6'/>`;
for(let i=0;i<10;i++){const a=i*36;s+=`<g transform='rotate(${a}) translate(0 -108) scale(.7)'>`+[-60,-30,0,30,60].map((d,k)=>`<path d='${PET}' transform='rotate(${d})' fill='${k%2?'#f3e9ff':'#d9c8f0'}' stroke='#8b3fd9' stroke-width='1.5'/>`).join('')+`</g>`;
s+=`<g transform='rotate(${a+18}) translate(0 -108)'><path d='M-4 0L0 -7L4 0' fill='none' stroke='#be123c' stroke-width='1.5'/></g>`;}
$('wreath').innerHTML=s;}
function petals(x,y,n){for(let i=0;i<4+n;i++){const p=document.createElement('div');p.className='petal';p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',(Math.random()*120-60)+'px');p.style.setProperty('--r',(Math.random()*540-270)+'deg');const X=document.body.classList.contains('xmas');p.style.background=X?(i%2?'#c8102e':'#1f7a4d'):(i%2?'#be123c':'#12060d');p.style.border=X?'1px solid #f0d78c':'1px solid #be123c';document.body.appendChild(p);setTimeout(()=>p.remove(),1400);}}
const NOW=new Date(),PREVIEW=location.hash==='#birthday',BK=PREVIEW?'test':String(NOW.getFullYear());
const IS_BDAY=PREVIEW||(NOW.getMonth()+1===CONFIG.bday.month&&NOW.getDate()===CONFIG.bday.day);
const XPREV=location.hash==='#christmas',IS_XMAS=CONFIG.xmas.on&&(XPREV||(NOW.getMonth()===11&&NOW.getDate()>=CONFIG.xmas.from&&NOW.getDate()<=CONFIG.xmas.to));
function bdayBanner(){const o=document.createElement('div');o.id='bdb';o.innerHTML=`<div><div style='font-size:34px;color:var(--blood)'>ゴゴゴ</div><h1>Happy Birthday, ${esc(CONFIG.name)}</h1><p>${esc(CONFIG.bday.banner)}</p><button id='bdgo'>Enter</button></div>`;document.body.appendChild(o);
 $('bdgo').onclick=()=>{o.remove();petals(innerWidth/2,innerHeight/3,10);for(let i=0;i<12;i++)setTimeout(()=>floater(Math.random()*innerWidth,innerHeight*.3+Math.random()*innerHeight*.4,'ゴ'),i*70);document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),1600);};}
function bEncounter(){if(!IS_BDAY||S.seen['bp'+BK]||document.querySelector('.toast')||$('bdb'))return;let balls=3;const t=document.createElement('div');t.className='toast';
 const set=m=>{t.innerHTML=`${m}<br><button id='bt'>Throw Poké Ball (${balls})</button><button class='b2' id='br'>Run</button>`;$('bt').onclick=throwIt;$('br').onclick=()=>t.remove();};
 const throwIt=()=>{if(Math.random()<.25){const pz=CONFIG.bday.prizes[Math.floor(Math.random()*CONFIG.bday.prizes.length)];S.seen['bp'+BK]=pz;save();t.innerHTML=`Gotcha! ${esc(CONFIG.encounterMon)} was caught!<br>Prize: <b>${esc(pz)}</b>`;petals(innerWidth/2,innerHeight/2,10);render();setTimeout(()=>t.remove(),7000);return;}
  balls--;if(balls<=0){t.innerHTML=`Oh no! ${esc(CONFIG.encounterMon)} got away…`;setTimeout(()=>t.remove(),2500);return;}set('It broke free!');};
 document.body.appendChild(t);set(`A wild <b>${esc(CONFIG.encounterMon)}</b> appeared!<br>It looks really hard to catch…`);setTimeout(()=>t.remove(),25000);}
function buildXmas(){
 document.body.classList.add('xmas');
 let s=`<circle r='108' fill='none' stroke='#1f6b3a' stroke-width='3'/><circle r='108' fill='none' stroke='#f0d78c' stroke-width='1' stroke-dasharray='2 9'/>`;
 for(let i=0;i<12;i++){const a=i*30;
  s+=`<g transform='rotate(${a}) translate(0 -108) scale(.8)'>`+[-58,58].map(d=>`<path d='${PET}' transform='rotate(${d})' fill='#1f7a4d' stroke='#0f3d24' stroke-width='1.5'/>`).join('')+`</g>`;
  if(i%2===0)s+=`<g transform='rotate(${a+15}) translate(0 -108)'>`+[[-4,0],[4,0],[0,-5]].map(p=>`<circle cx='${p[0]}' cy='${p[1]}' r='3.4' fill='#c8102e' stroke='#7a0a1c'/>`).join('')+`</g>`;}
 $('wreath').innerHTML=s;
 $('sigil').insertAdjacentHTML('beforeend',`<g transform='rotate(-12 94 22)'><path d='M50 20C56 -20 98 -36 142 -28C120 -12 130 6 140 20Z' fill='#c8102e' stroke='#7a0a1c' stroke-width='2'/><rect x='42' y='12' width='104' height='20' rx='10' fill='#f4f1ea'/><circle cx='142' cy='-28' r='11' fill='#f4f1ea'/></g>`);
}
function snow(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 for(let i=0;i<34;i++){const f=document.createElement('div');f.className='snow';f.textContent=i%2?'❅':'❆';f.style.left=(Math.random()*100)+'vw';f.style.fontSize=(10+Math.random()*14)+'px';f.style.animationDuration=(9+Math.random()*9)+'s';f.style.animationDelay=(-Math.random()*18)+'s';f.style.setProperty('--sx',(Math.random()*90-45)+'px');document.body.appendChild(f);}}
function xmasBanner(){const o=document.createElement('div');o.id='bdb';o.innerHTML=`<div><div style='font-size:34px;color:var(--blood)'>❄ ✦ ❄</div><h1>Merry Christmas, ${esc(CONFIG.name)}</h1><p>${esc(CONFIG.xmas.banner)}</p><button id='xmgo'>Enter</button></div>`;document.body.appendChild(o);
 $('xmgo').onclick=()=>{o.remove();S.seen['xm'+NOW.getFullYear()]=1;save();petals(innerWidth/2,innerHeight/3,10);};}
if(IS_XMAS){buildXmas();snow();$('sub').textContent=CONFIG.xmas.sub;if(XPREV||!S.seen['xm'+NOW.getFullYear()])xmasBanner();}else buildWreath();
if(IS_BDAY){bdayBanner();}
/* ORA sound: put a short clip named ora.mp3 next to index.html. If the file isn't there, nothing plays. */
const oraSnd=new Audio("ora.mp3");oraSnd.preload="auto";
function playOra(){try{oraSnd.currentTime=0;const p=oraSnd.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
$("sigil").addEventListener("click",e=>{
  playOra();
  $("eye").setAttribute("r",String(8+Math.random()*5));
  add(1,null,e);
});

/* wild encounters */
function encounter(){
  if(S.xp<3||document.querySelector(".toast"))return;
  const t=document.createElement("div");t.className="toast";
  t.innerHTML=`A wild <b>${esc(CONFIG.encounterMon)}</b> appeared!<br><button id="cb">Throw Poké Ball</button><button class="b2" id="rb">Run</button>`;
  document.body.appendChild(t);
  const close=()=>t.remove();
  $("cb").onclick=()=>{t.innerHTML="Gotcha! "+esc(CONFIG.encounterMon)+" was caught! (+5 XP)";add(5);setTimeout(close,1600);};
  $("rb").onclick=close;
  setTimeout(close,12000);
}
setInterval(()=>{if(Math.random()<.5)encounter();},25000);

/* secret words */
let buf="";
addEventListener("keydown",e=>{
  buf=(buf+e.key.toLowerCase()).slice(-12);
  if(/(ora|muda|menacing|jojo)$/.test(buf)){
    playOra();
    document.body.classList.add("shake");setTimeout(()=>document.body.classList.remove("shake"),1600);
    for(let i=0;i<14;i++)setTimeout(()=>floater(Math.random()*innerWidth,innerHeight*.3+Math.random()*innerHeight*.5,"ゴ"),i*70);
    if(!S.ora){S.ora=true;add(10);}
    buf="";
  }
});

function ora(){playOra();document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),1600);for(let i=0;i<14;i++)setTimeout(()=>floater(Math.random()*innerWidth,innerHeight*.3+Math.random()*innerHeight*.5,'ゴ'),i*70);if(!S.ora){S.ora=true;add(10);}}
let lastTap=0;
$('title').style.touchAction='manipulation';$('title').style.userSelect='none';
$('title').addEventListener('pointerup',()=>{const n=Date.now();if(n-lastTap<350){lastTap=0;ora();}else lastTap=n;});
$("reset").onclick=()=>{if(confirm("Reset all progress?")){S={xp:0,seen:{},ora:false};save();render();}};
render();
</script>
