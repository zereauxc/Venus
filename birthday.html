<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Venus</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0414;--ink:#fff1fb;--dim:#d2aee6;--vio:#b44dff;--pink:#ff3d8b;--hot:#ff2a5f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"VT323",ui-monospace,Menlo,monospace;font-size:22px;line-height:1.35;background:radial-gradient(ellipse at 50% 0%,#5b1a7a 0%,#2a0a3d 40%,var(--bg) 75%) fixed,var(--bg);overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 20%,#ffd1ec,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#e3c8ff,transparent),radial-gradient(2px 2px at 85% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 85%,#ffd1ec,transparent),radial-gradient(1.5px 1.5px at 55% 45%,#fff,transparent);animation:tw 3s ease-in-out infinite alternate}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:24px 18px 90px;text-align:center}
h1{font-family:"Cinzel",Georgia,serif;font-size:clamp(28px,8vw,46px);margin:10px 0;background:linear-gradient(90deg,#ff3d8b,#b44dff,#ff3d8b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite;filter:drop-shadow(0 0 14px #ff3d8b88)}
p{margin:8px 0}
.dim{color:var(--dim)}
#wrap{width:min(78vw,300px);margin:44px auto 6px;cursor:pointer;animation:bob 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 0 22px #b44dffaa)}
#wrap.open{cursor:default;animation:none}
#wrap svg{width:100%;display:block;overflow:visible}
#lid{transform-box:fill-box;transform-origin:center;transition:transform .9s cubic-bezier(.2,1.4,.4,1),opacity .9s}
#wrap.open #lid{transform:translate(40px,-110px) rotate(24deg);opacity:0}
#glow{opacity:0;transition:opacity .8s}
#ghost{transform-box:fill-box;transform-origin:center;transform:translateY(70px) scale(.6);opacity:0;transition:transform 1s cubic-bezier(.2,1.6,.4,1) .35s,opacity .4s .35s}
#wrap.open #ghost{transform:translateY(-34px) scale(1.15);opacity:1}
.fl{transform-box:fill-box;animation:fl 2.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
#wrap.open #glow{opacity:1}
.msg{font-size:28px;color:#fff;text-shadow:0 0 14px var(--pink);margin:18px 0;animation:rise .8s both}
.prize{border:2px solid var(--pink);background:#2a0a3dcc;padding:16px;margin:20px 0;box-shadow:0 0 28px #ff3d8b66;animation:rise .8s both}
.prize b{font-family:"Cinzel",Georgia,serif;color:#ffd1ec}
#mon{position:fixed;width:58px;height:58px;z-index:5;cursor:pointer;transition:left .3s,top .3s;filter:drop-shadow(0 0 12px var(--pink));-webkit-tap-highlight-color:transparent}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,420px);background:#000;border:2px solid var(--pink);padding:12px;z-index:30;text-align:center}
button{font:inherit;color:#fff;background:var(--vio);border:0;padding:4px 14px;cursor:pointer;margin:6px 4px 0}
button.b2{background:#444}
a{color:var(--pink)}
.back{display:inline-block;margin-top:30px;font-size:18px;color:var(--dim)}
.cf{position:fixed;width:9px;height:14px;pointer-events:none;z-index:40;border-radius:2px;animation:cf 1.7s ease-out forwards}
.shake{animation:sk .5s 2}
@keyframes tw{from{opacity:.35}to{opacity:1}}
@keyframes sh{to{background-position:200% 0}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes cf{to{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 260px)) rotate(var(--r))}}
@keyframes sk{25%{transform:translate(4px,-3px)}75%{transform:translate(-4px,3px)}}
@media (prefers-reduced-motion:reduce){.stars,#wrap,h1{animation:none}}
</style>
</head>
<body>
<div class="stars"></div>
<main>
  <section id="sealed" hidden>
    <h1>Not yet…</h1>
    <p class="dim">Something wakes on February 2nd. Come back then.</p>
    <a class="back" href="index.html">← Back</a>
  </section>

function burst(x,y,n){const c=["#ff3d8b","#b44dff","#ffd36b","#5ee7ff","#ff2a5f"];

  if(!quiet){burst(innerWidth/2,innerHeight/3,60);document.body.classList.add("shake");setTimeout(()=>document.body.classList.remove("shake"),1100);}
  $("msg").textContent=CONFIG.message;$("msg").hidden=false;
  setTimeout(startHunt,quiet?300:1800);
}

let busy=false,balls=3,timer=null;
function move(){if(busy)return;const m=$("mon");m.style.left=(5+Math.random()*80)+"vw";m.style.top=(18+Math.random()*65)+"vh";}
function startHunt(){
  if(S.seen["bp"+BK]){$("prize").hidden=false;return;}
  $("hint").hidden=false;$("mon").hidden=false;move();timer=setInterval(move,1000);
  $("mon").onclick=battle;
}
function set(m){$("toast").innerHTML=m+"<br><button id='bt'>Throw Poké Ball ("+balls+")</button><button class='b2' id='br'>Run</button>";$("bt").onclick=throwB;$("br").onclick=end;}
function end(){$("toast").hidden=true;busy=false;}
function battle(){if(busy)return;busy=true;balls=3;$("toast").hidden=false;set("A wild <b>"+CONFIG.mon+"</b> appeared!<br>It looks really hard to catch…");}
function throwB(){
  if(Math.random()<.25){caught();return;}
  balls--;
  if(balls<=0){$("toast").innerHTML="Oh no! "+CONFIG.mon+" got away…";setTimeout(end,2000);return;}
  set("It broke free!");
}
function caught(){
  S.seen["bp"+BK]=1;save();clearInterval(timer);$("mon").hidden=true;$("hint").hidden=true;
  $("toast").innerHTML="Gotcha! "+CONFIG.mon+" was caught!";burst(innerWidth/2,innerHeight/2,80);
  setTimeout(()=>{$("toast").hidden=true;busy=false;$("prize").hidden=false;},2200);
}

if(!IS){$("sealed").hidden=false;}
else{$("live").hidden=false;if(S.seen["bg"+BK])openBox(true);else $("wrap").onclick=()=>openBox(false);}
</script>
</body>
</html>
